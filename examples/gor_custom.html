<!doctype html><html lang="ru"><head><meta charset="utf-8"><style>
:root{--red:#FF1E00;--dark:#292929;--paper:#FFFFFF;--f-disp:'YS Compressed Heavy';--f-mono:'YS SemiMono Regular';--r-card:40px;--mx:58px;}
*{box-sizing:border-box;margin:0;padding:0;}
.slide{position:relative;width:1920px;height:1080px;overflow:hidden;background:#000;color:var(--paper);font-family:var(--f-mono),sans-serif;}
.h1{font-family:var(--f-disp);font-size:96px;line-height:.98;margin:72px var(--mx) 0;}
.org{position:absolute;inset:0 0 120px 0;}
.org svg{position:absolute;inset:0;width:1920px;height:960px;}
.node{position:absolute;background:var(--ink,#000);border:2px solid #fff;border-radius:999px;padding:20px 26px;display:flex;align-items:center;gap:20px;width:360px;}
.node.head{background:var(--red);}
.ava{width:96px;height:96px;border-radius:24px;background:#111;flex:0 0 auto;}
.who{display:flex;flex-direction:column;}
.who .name{font-family:var(--f-disp);font-size:34px;line-height:1.02;}
.who .role{font-family:var(--f-mono);font-size:22px;opacity:.8;}
</style></head><body><div id="deck">
<div class="slide">
  <div class="h1">Орден Феникса</div>
  <div class="org">
    <svg viewBox="0 0 1920 960">
      <line x1="960" y1="360" x2="360" y2="620" stroke="#4a4a4a" stroke-width="3"/>
      <line x1="960" y1="360" x2="960" y2="620" stroke="#4a4a4a" stroke-width="3"/>
      <line x1="960" y1="360" x2="1560" y2="620" stroke="#4a4a4a" stroke-width="3"/>
    </svg>
    <div class="node head" style="left:780px;top:300px"><div class="ava"></div><div class="who"><span class="name">Альбус Дамблдор</span><span class="role">Руководитель</span></div></div>
    <div class="node" style="left:180px;top:560px"><div class="ava"></div><div class="who"><span class="name">Аластор Грюм</span><span class="role">Оперативный отдел</span></div></div>
    <div class="node" style="left:780px;top:560px"><div class="ava"></div><div class="who"><span class="name">Северус Снейп</span><span class="role">Исследования</span></div></div>
    <div class="node" style="left:1380px;top:560px"><div class="ava"></div><div class="who"><span class="name">Артур Уизли</span><span class="role">Поддержка</span></div></div>
  </div>
</div></div></body></html>
