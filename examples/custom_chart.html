<!DOCTYPE html>
<html><head><meta charset="utf-8">
<!-- Смоук data-chart (0.35.0): нативные PowerPoint-чарты из custom-HTML.
     Слайд 0: column (2 серии, labels) + line рядом — «комбо» из двух чартов;
     внутри первого — заглушка для браузерного превью (в .pptx НЕ идёт).
     Слайд 1: doughnut (доли, одна серия) с легендой.
     Данные — выдуманные смоуковые (не пользовательские). -->
<style>
  html,body{margin:0;background:#555}
  .slide{position:relative;width:1920px;height:1080px;box-sizing:border-box;
         background:#fff;color:#21201f;padding:79px 125px 120px;
         display:flex;flex-direction:column;align-items:flex-start;
         font-family:'YS Text';overflow:hidden}
  .h1{font-family:'YS Geo';font-weight:900;font-size:66px;line-height:1.06;
      letter-spacing:0;max-width:1450px}
  .row{display:flex;gap:60px;margin-top:48px}
  .cap{font-size:28px;line-height:1.3;color:#807d7b;margin-top:16px}
  .stub{display:flex;align-items:center;justify-content:center;height:100%;
        color:#c9c6c3;font-size:24px}
</style></head><body>
<div id="deck">
<section class="slide">
  <div class="h1">Выручка растёт быстрее заказов</div>
  <div class="row">
    <div>
      <div class="nchart" style="width:820px;height:520px"
           data-chart='{"type":"column","categories":["Q1","Q2","Q3","Q4"],
             "series":{"GMV, млн": [12, 18, 27, 41], "Заказы, тыс": [8, 11, 13, 16]},
             "labels": true}'>
        <div class="stub">превью: столбцы GMV и заказов</div>
      </div>
      <div class="cap">Столбцы: две серии, метки данных</div>
    </div>
    <div>
      <div class="nchart" style="width:760px;height:520px"
           data-chart='{"type":"line",
             "categories":["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"],
             "series":{"Средний чек": [640, 655, 631, 662, 700, 742, 735, 758, 761, 790, 805, 812],
                       "цель 800": {"values": [800,800,800,800,800,800,800,800,800,800,800,800],
                                    "color": "#C9C6C3", "labels": false}}}'></div>
      <div class="cap">Плотная линия: цифры на ключевых точках; серая цель без цифр</div>
    </div>
  </div>
</section>
<section class="slide">
  <div class="h1">Заказы приходят из трёх каналов</div>
  <div class="nchart" style="width:900px;height:600px;margin-top:48px"
       data-chart='{"type":"doughnut","categories":["Приложение","Сайт","Партнёры"],
         "series":{"Доля": [61, 27, 12]},
         "labels": true, "number_format": "0\"%\""}'></div>
</section>
</div>
</body></html>
