<svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
  <!-- Донат-прогресс. Доля задаётся stroke-dasharray="ДУГА ОСТАТОК" жёлтого круга:
       ДУГА = доля × 565.5 (длина окружности r=90), ОСТАТОК = 565.5 − ДУГА.
       Пример ниже — 72% (407 158.5). Дуга стартует сверху (rotate -90).
       Цифру в центр клади HTML-текстом ПОВЕРХ svg (позиционированием),
       не <text> внутри — SVG-текст растеризуется и перестаёт редактироваться. -->
  <circle cx="110" cy="110" r="90" fill="none" stroke="#E9E7E6" stroke-width="36"/>
  <circle cx="110" cy="110" r="90" fill="none" stroke="#FFD700" stroke-width="36"
          stroke-dasharray="407 158.5" transform="rotate(-90 110 110)"/>
</svg>
